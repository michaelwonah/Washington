paths:
  /api/v1/admin:
    post:
      summary: Create admin
      tags: [admins]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - confirmPassword
              properties:
                firstName:
                  type: string
                  example: michael
                lastName:
                  type: string
                  example: wonah
                email:
                  type: string
                  format: email
                  example: leonardo@gmail.com
                phoneNumber:
                  type: string
                  example: 09124545904
                password:
                  type: string
                  format: password
                  example: Thecurve@
      responses:
        "201":  
          description: admin created successfully
        "400":
          description: validation error
        "409":
          description: admin already exists


  /api/v1/admin/signIn:
    post:
      summary: signIn admin
      tags: [admins]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties: 
                email:
                  type: string
                  format: email
                  example: leonardo@gmail.com
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: login successfully
        "400":
          description: invalid credentials or validation error
        "404":
          description: admin not found
        "429":
          description: account locked after too many failed attempts


  /api/v1/admin/reset-password:
    post:
      summary: Send reset password link
      tags: [admins]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required:
                - email
              properties: 
                email:
                  type: string
                  format: email
                  example: leonardo@gmail.com
      responses:
        "200":
          description: password reset link sent to email
        "400":
          description: invalid credentials or validation error

  /api/v1/admin/reset-password/{token}:
    post:
      summary: Reset password with email link token
      tags: [admins]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
          description: Reset password token from the email link
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required:
                - password
                - confirmPassword
              properties: 
                password:
                  type: string
                  format: password
                  example: NewPass@123
                confirmPassword:
                  type: string
                  format: password
                  example: NewPass@123
      responses:
        "200":
          description: password reset successfully
        "400":
          description: invalid or expired reset link, or validation error
